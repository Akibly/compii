[project]
name = "compii-core"
version = "0.1.0"
description = "Compii Core: the local agent service that does the work behind the Wisp character."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.11",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "openpyxl>=3.1",
  "pypdf>=5.0",
  "uiautomation>=2.0 ; sys_platform == 'win32'",
  "faster-whisper>=1.2.1",
  "sounddevice>=0.5.6",
  "kokoro-onnx>=0.6.1",
  "numpy>=2.4.6",
  "playwright>=1.64.0",
  "cryptography>=50.0.2",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[project.scripts]
compii-core = "compii_core.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
